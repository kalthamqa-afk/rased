<style>

/* Layout: a school register — sticky ink-blue header, a picker strip, then the roster sheet with a sticky save bar */
:root{
  color-scheme:light;

  --accent:#2A4A9E; --accent-ink:#FFFFFF; --accent-soft:#E5EBF9; --head:#1D3577; --head-ink:#FFFFFF;
  --ok:#14794A; --ok-bg:#DDF2E5; --no:#BE2F28; --no-bg:#FBE3E1; --late:#B95F00; --late-bg:#FCE9CF;
  --cell:#FFFFFF; --shadow:0 1px 2px rgba(20,33,58,.06),0 6px 18px rgba(20,33,58,.06);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#162034; --surface-2:#1B2740; --ink:#E5EAF4; --muted:#9BA7C0; --line:#2A3752;
  --accent:#8AA4EE; --accent-ink:#0E1420; --accent-soft:#223059; --head:#142552; --head-ink:#EEF2FB;
  --ok:#52C98A; --ok-bg:#15392A; --no:#F2807A; --no-bg:#45201F; --late:#F3A653; --late-bg:#402C12;
  --cell:#162034; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#162034; --surface-2:#1B2740; --ink:#E5EAF4; --muted:#9BA7C0; --line:#2A3752;
  --accent:#8AA4EE; --accent-ink:#0E1420; --accent-soft:#223059; --head:#142552; --head-ink:#EEF2FB;
  --ok:#52C98A; --ok-bg:#15392A; --no:#F2807A; --no-bg:#45201F; --late:#F3A653; --late-bg:#402C12;
  --cell:#162034; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl;height:100%}
[hidden]{display:none!important}
body{margin:0}

.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.3}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink)}
.topbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-family:var(--f-display);font-size:19px;flex:none}

.nav{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}

.wrap{max-width:1280px;margin-inline:auto;padding-block:18px 120px;

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.demo-note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:8px 12px}

/* Buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field select,.field input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15.5px;width:100%}
.field select:focus,.field input:focus{border-color:var(--accent);outline:none}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:440px;padding:28px;display:flex;flex-direction:column;gap:18px}
.login-head{display:flex;flex-direction:column;gap:6px}
.login-head .brand-mark{background:var(--head);color:var(--head-ink);width:46px;height:46px;font-size:24px;border-radius:12px}
.login-head h1{font-size:26px}
.login-head p{margin:0;color:var(--muted);font-size:14px}
.login form{display:flex;flex-direction:column;gap:12px}
.err{color:var(--no);font-size:13.5px;min-height:1.4em;margin:0}
.demo-accts{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.demo-accts h2{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;text-align:start;width:100%}
.acct:hover{border-color:var(--accent)}
.acct b{font-weight:600;font-size:14px}

.acct code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;color:var(--muted)}

/* Picker */
.picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px}
@media (max-width:560px){.picker{grid-template-columns:1fr 1fr}.picker .field:last-child{grid-column:1/-1}}

/* Sheet */
.sheet{padding:0;overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:21px}
.meta{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-d{background:var(--ok-bg);color:var(--ok)} .p-d i{background:var(--ok)}
.p-n{background:var(--no-bg);color:var(--no)} .p-n i{background:var(--no)}
.p-l{background:var(--late-bg);color:var(--late)} .p-l i{background:var(--late)}
.p-e{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .p-e i{background:var(--line)}

.tablewrap{overflow:auto;max-height:68vh;overscroll-behavior:contain}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.grid th,.grid td{padding:6px 6px;border-bottom:1px solid var(--line);background:var(--surface)}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--muted);text-align:center;white-space:nowrap}
.grid .name{position:sticky;right:0;z-index:1;text-align:start;min-width:210px;max-width:250px;box-shadow:-1px 0 0 var(--line);padding-inline:12px}
.grid thead .name{z-index:3}
.grid tbody tr:hover td{background:var(--surface-2)}
.sname{display:flex;gap:8px;align-items:baseline;font-weight:500;font-size:14.5px;line-height:1.4}
.sname .idx{color:var(--muted);font-size:12px;min-width:18px;font-variant-numeric:tabular-nums}
.hw-h{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.hw-h b{color:var(--ink);font-size:13.5px}
.fill{border:1px dashed var(--line);background:transparent;border-radius:7px;padding:2px 4px;font-size:11.5px;color:var(--muted)}
.st{appearance:none;-webkit-appearance:none;width:100%;min-width:118px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--cell);color:var(--muted);font-size:13.5px;font-weight:600;text-align:center;text-align-last:center;cursor:pointer}
.st option{background:var(--surface);color:var(--ink)}
.st[data-v="d"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.st[data-v="n"]{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.st[data-v="l"]{background:var(--late-bg);border-color:var(--late);color:var(--late)}
.st.changed{box-shadow:0 0 0 2px var(--accent-soft)}
@media (max-width:600px){.grid .name{min-width:150px;max-width:160px}.sname{font-size:13.5px}.st{min-width:104px;font-size:12.5px;padding:7px 6px}}

/* Save bar */
.savebar{position:fixed;inset:auto 0 0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(20,33,58,.08);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar-in{max-width:1280px;margin-inline:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.counts{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.dirty{font-size:13px;color:var(--late);font-weight:600}
.dirty.clean{color:var(--muted);font-weight:500}
.save-btn{margin-inline-start:auto;font-size:16px;padding:11px 26px;border-radius:11px}
@media (max-width:600px){.save-btn{width:100%;justify-content:center}}

/* Admin */
.admin-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.admin-head h2{font-size:24px}
.admin-tools{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.admin-tools .field{width:160px}
.admin-tools .field select{padding:8px 10px;font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi.k-no b{color:var(--no)} .kpi.k-late b{color:var(--late)} .kpi.k-ok b{color:var(--ok)}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:17px}
.panel .sub{margin:-6px 0 0;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.gcard{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.gcard:last-child{border-bottom:0}
.gcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gcard-top b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.gcard-top span{font-weight:600}
.gcard small{color:var(--muted);font-size:12.5px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .b-d{background:var(--ok)} .bar .b-l{background:var(--late)} .bar .b-n{background:var(--no)}
.secgroup h4{margin:6px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.secrow{display:grid;grid-template-columns:62px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:4px 0}
.secrow .lbl{font-weight:600;font-size:14px}
.secrow .pct{text-align:left;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.secrow .none{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.tbl th{background:var(--surface-2);font-size:12.5px;color:var(--muted);font-weight:600}
.tbl td.n{font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td,.tbl tr.sel td{background:var(--accent-soft)}
.c-d{color:var(--ok);font-weight:600} .c-n{color:var(--no);font-weight:600} .c-l{color:var(--late);font-weight:600}
.mini{display:inline-block;width:70px;vertical-align:middle;margin-inline-start:8px}
.mini .bar{height:8px}
.row-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row-tools .field{width:200px}
.ugrid{border-collapse:separate;border-spacing:4px;font-size:13px}
.ugrid th{font-weight:600;color:var(--muted);font-size:12px;padding:2px 4px;text-align:center}
.ugrid th.u{text-align:start;white-space:nowrap;padding-inline-end:10px}
.chip{display:block;min-width:58px;text-align:center;border-radius:7px;padding:5px 6px;font-weight:600;font-size:12.5px}
.chip.d{background:var(--ok-bg);color:var(--ok)} .chip.n{background:var(--no-bg);color:var(--no)} .chip.l{background:var(--late-bg);color:var(--late)}
.chip.e{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.empty-state{color:var(--muted);font-size:14px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.note{font-size:13px;color:var(--muted);margin:0}
.backup-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Toast & modal */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow);transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--ok);color:#fff}
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(10,16,30,.45);display:grid;place-items:center;padding:16px}
.modal{max-width:420px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:19px}
.modal p{margin:0;color:var(--muted)}
.modal .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Offscreen PDF sheet (always light, for print) */
.pdf-sheet{position:fixed;top:0;left:-12000px;width:1000px;background:#fff;color:#14213A;padding:36px;font-family:var(--f-body);direction:rtl}
.pdf-sheet h1{font-family:var(--f-display);font-size:26px;margin:0 0 4px}
.pdf-sheet p{margin:0 0 18px;color:#5A6781;font-size:14px}
.pdf-sheet table{border-collapse:collapse;width:100%;font-size:14px}
.pdf-sheet th,.pdf-sheet td{border:1px solid #CBD3E1;padding:7px 9px;text-align:right}
.pdf-sheet th{background:#EEF2F9}

.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted);font-size:15px}
.loading div{display:flex;flex-direction:column;align-items:center;gap:12px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.config-warn{background:var(--late-bg);color:var(--late);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:500}
.modal .field input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
</style>
</head>

<script>
/* ===== إعدادات الربط بقاعدة البيانات — تُعبّأ مرة واحدة ===== */
const CONFIG = {
  SUPABASE_URL: "https://cifvcqxkeouqfeckgyfk.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_KQGEqKO9AT5_13SoFfcqxQ_BhWKcKro",
  EMAIL_DOMAIN: "rasd-arabic.app"
};
/* ============================================================ */
(function(){
"use strict";
const SCHOOL = "مدرسة البيان الإعدادية للبنات";
const GRADES = {7:{name:"السابع",short:"سابع",count:8},8:{name:"الثامن",short:"ثامن",count:9},9:{name:"التاسع",short:"تاسع",count:8}};
const SECTIONS = [];
[7,8,9].forEach(g=>{for(let n=1;n<=GRADES[g].count;n++)SECTIONS.push({id:g+"-"+n,grade:g,num:n,label:GRADES[g].short+"/"+n});});
const SEC = Object.fromEntries(SECTIONS.map(s=>[s.id,s]));
const UNIT_NAMES = ["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة"];
const UNITS = [1,2,3,4,5,6,7];
const ST = {d:{label:"تم التسليم",short:"تم"},n:{label:"لم يتم التسليم",short:"لم يسلّم"},l:{label:"تأخير",short:"متأخر"}};
const ROLE_NAME = {admin:"إدارة",teacher:"معلمة",viewer:"اطلاع فقط"};

const CONFIGURED = /^https:\/\//.test(CONFIG.SUPABASE_URL) && CONFIG.SUPABASE_ANON_KEY.length > 40;
const sb = CONFIGURED && window.supabase ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true}}) : null;

/* ---------- Data (loaded from the database) ---------- */
let STUDENTS = {}, BYSEC = {}, RECORDS = {}, PROFILES = [], INACTIVE = [], LOADED_AT = null;

async function fetchAll(table, cols, order){
  const out=[]; const step=1000;
  for(let from=0;;from+=step){
    let q=sb.from(table).select(cols);
    order.forEach(o=>{q=q.order(o);});
    const {data,error}=await q.range(from,from+step-1);
    if(error) throw error;
    out.push(...data);
    if(data.length<step) break;
  }
  return out;
}
async function loadAll(){
  const jobs=[fetchAll("students","id,section,seq,name,active",["section","seq"]),
              fetchAll("marks","student_id,section,unit,hw,status",["student_id","unit","hw"]),
              fetchAll("sheet_meta","section,unit,saved_by_name,saved_at",["section","unit"])];
  if(S.user.role==="admin") jobs.push(fetchAll("profiles","username,full_name,role,sections",["role","username"]));
  const [stu,marks,meta,profs]=await Promise.all(jobs);
  STUDENTS={}; BYSEC={}; RECORDS={}; INACTIVE=[];
  SECTIONS.forEach(s=>BYSEC[s.id]=[]);
  stu.forEach(r=>{const id=String(r.id); if(!BYSEC[r.section]) return; if(r.active===false){INACTIVE.push({id,name:r.name,sec:r.section});return;} STUDENTS[id]={id,name:r.name,sec:r.section,seq:r.seq}; BYSEC[r.section].push(id);});
  meta.forEach(m=>{RECORDS[m.section+"|"+m.unit]={s:{},by:m.saved_by_name||"",at:Date.parse(m.saved_at)};});
  marks.forEach(m=>{const k=m.section+"|"+m.unit; if(!RECORDS[k]) RECORDS[k]={s:{},by:"",at:null};
    const sid=String(m.student_id); const arr=RECORDS[k].s[sid]||(RECORDS[k].s[sid]=["","","","","",""]); arr[m.hw-1]=m.status;});
  PROFILES=profs||[]; LOADED_AT=Date.now();
}

const fmtShort = ts => ts? new Date(ts).toLocaleDateString("ar-QA-u-nu-latn",{day:"numeric",month:"short"}) : "—";

let toastT; function toast(msg,kind){const t=$("#toast");t.textContent=msg;t.className="toast show"+(kind?" "+kind:"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",3200);}
function errText(e){const m=(e&&(e.message||e.error_description))||"";
  if(/Invalid login/i.test(m)) return "البريد الإلكتروني أو كلمة المرور غير صحيحة. تحققي منهما وحاولي مرة أخرى.";
  if(/fetch|network|Failed/i.test(m)) return "تعذّر الاتصال بالخادم. تحققي من الإنترنت ثم أعيدي المحاولة.";
  if(/JWT|expired|session/i.test(m)) return "انتهت الجلسة. سجّلي الدخول مرة أخرى.";
  return m||"حدث خطأ غير متوقع. أعيدي المحاولة.";}
function confirmBox({title,text,buttons}){return new Promise(res=>{
  const root=$("#modalRoot");
  root.innerHTML=`<div class="modal-back"><div class="modal card" role="dialog" aria-modal="true" aria-labelledby="mT"><h3 id="mT">${esc(title)}</h3><p>${esc(text)}</p><div class="acts">${buttons.map((b,i)=>`<button class="btn ${b.primary?"btn-primary":""}" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div></div>`;
  root.querySelectorAll("button").forEach(b=>b.onclick=()=>{root.innerHTML="";res(buttons[+b.dataset.i].value);});
  const first=root.querySelector(".btn-primary")||root.querySelector("button"); if(first) first.focus();
});}
function loadingScreen(msg){$("#app").innerHTML=`<div class="loading"><div><span class="spin" aria-hidden="true"></span><span>${esc(msg)}</span></div></div>`;}

function unitsOf(f){return f==="all"?UNITS:[+f];}
function fin(o){o.rec=o.d+o.l+o.n;o.e=o.total-o.rec;o.pct=o.rec?(o.d+o.l)/o.rec:null;o.ontime=o.rec?o.d/o.rec:null;return o;}
function statsSec(secId,f){const o={d:0,l:0,n:0,total:0};const ids=BYSEC[secId]||[];const us=unitsOf(f);o.total=ids.length*6*us.length;
  us.forEach(u=>{const rec=RECORDS[secId+"|"+u];if(!rec)return;ids.forEach(id=>{(rec.s[id]||[]).forEach(v=>{if(v==="d"||v==="l"||v==="n")o[v]++;});});});return fin(o);}
function addStats(list){const o={d:0,l:0,n:0,total:0};list.forEach(s=>{o.d+=s.d;o.l+=s.l;o.n+=s.n;o.total+=s.total;});return fin(o);}
function statsStudent(id,f){const st=STUDENTS[id];const o={d:0,l:0,n:0,total:6*unitsOf(f).length,units:[]};
  unitsOf(f).forEach(u=>{const rec=RECORDS[st.sec+"|"+u];const arr=rec&&rec.s[id]?rec.s[id]:["","","","","",""];arr.forEach(v=>{if(v)o[v]++;});o.units.push({u,arr,n:arr.filter(v=>v==="n").length});});return fin(o);}
function lastMod(secId){let best=null;UNITS.forEach(u=>{const r=RECORDS[secId+"|"+u];if(r&&r.at&&(!best||r.at>best.at))best=r;});return best;}
function barHTML(s){if(!s.rec)return `<div class="bar" aria-hidden="true"></div>`;const w=v=>(v/s.rec*100).toFixed(2)+"%";
  return `<div class="bar" role="img" aria-label="تم ${s.d}، تأخير ${s.l}، لم يتم ${s.n}"><i class="b-d" style="width:${w(s.d)}"></i><i class="b-l" style="width:${w(s.l)}"></i><i class="b-n" style="width:${w(s.n)}"></i></div>`;}

function dirtyCount(){if(!S.draft)return 0;let c=0;(BYSEC[S.sec]||[]).forEach(id=>{for(let i=0;i<6;i++)if((S.draft[id][i]||"")!==(S.saved[id][i]||""))c++;});return c;}
function loadDraft(){const rec=RECORDS[S.sec+"|"+S.unit];S.saved={};S.draft={};(BYSEC[S.sec]||[]).forEach(id=>{const a=rec&&rec.s[id]?rec.s[id].slice():["","","","","",""];S.saved[id]=a.slice();S.draft[id]=a.slice();});}

function reportData(){
  const f=S.adminUnit; const ul=unitLabel();
  if(S.adminTab==="student"){
    if(S.repStu){const d=statsStudent(S.repStu,"all");const st=STUDENTS[S.repStu];
      return {title:"تقرير الطالبة: "+st.name,sub:SEC[st.sec].label+" · الوحدات السبع",file:"تقرير-"+st.name,
        head:["الوحدة","واجب 1","واجب 2","واجب 3","واجب 4","واجب 5","واجب 6","لم يتم"],
        rows:d.units.map(({u,arr,n})=>["الوحدة "+UNIT_NAMES[u-1],...arr.map(v=>v?ST[v].label:"—"),n]).concat([["المجموع","تم: "+d.d,"تأخير: "+d.l,"لم يتم: "+d.n,"فارغ: "+d.e,"النسبة: "+pctTxt(d.pct),"",""]])};}
    return {title:"طالبات الشعبة "+SEC[S.repSec].label,sub:ul,file:"طالبات-"+SEC[S.repSec].label.replace("/","-"),head:["#","الطالبة","تم","تأخير","لم يتم","فارغ","نسبة التسليم"],
      rows:(BYSEC[S.repSec]||[]).map((id,i)=>{const s=statsStudent(id,f);return [i+1,STUDENTS[id].name,s.d,s.l,s.n,s.e,pctTxt(s.pct)];})};
  }
  if(S.adminTab==="repeat"){const l=repeatList(S.threshold);
    return {title:"الطالبات المتكرر عدم تسليمهن ("+S.threshold+" فأكثر)",sub:ul,file:"المتكرر-عدم-تسليمهن",head:["#","الطالبة","الشعبة","لم يتم","تأخير","الوحدات"],
      rows:l.map((r,i)=>[i+1,STUDENTS[r.id].name,SEC[STUDENTS[r.id].sec].label,r.s.n,r.s.l,r.units.join("، ")])};}
  return {title:"تقرير متابعة الواجبات حسب الشعب",sub:ul,file:"تقرير-الشعب",head:["الشعبة","الطالبات","المرصود","تم","تأخير","لم يتم","فارغ","نسبة التسليم","آخر تعديل"],
    rows:sectionRows().map(({x,s,lm})=>[x.label,(BYSEC[x.id]||[]).length,s.rec,s.d,s.l,s.n,s.e,pctTxt(s.pct),lm?lm.by+" · "+fmtShort(lm.at):"—"])};
}
async function exportReport(kind){
  const r=reportData(); const stamp=" — "+SCHOOL+" — "+new Date().toLocaleDateString("ar-QA-u-nu-latn",{day:"numeric",month:"long",year:"numeric"});
  if(kind==="xlsx"){
    if(!window.XLSX){toast("تعذّر تحميل مكتبة Excel. تحققي من الاتصال.");return;}
    const ws=XLSX.utils.aoa_to_sheet([[r.title],[r.sub+stamp],[],r.head,...r.rows]);
    ws["!cols"]=r.head.map(h=>({wch:h==="الطالبة"?34:(h==="آخر تعديل"||h==="الوحدات"?28:14)}));
    const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,"التقرير");
    saveFile(r.file+".xlsx",new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})]));return;
  }
  if(!window.html2canvas||!window.jspdf){toast("تعذّر تحميل مكتبة PDF. تحققي من الاتصال.");return;}
  toast("جارٍ تجهيز ملف PDF…");
  const el=document.createElement("div");el.className="pdf-sheet";
  el.innerHTML=`<h1>${esc(r.title)}</h1><p>${esc(r.sub+stamp)}</p><table><thead><tr>${r.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${r.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  document.body.appendChild(el);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const canvas=await html2canvas(el,{scale:2,backgroundColor:"#ffffff"});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"portrait",unit:"pt",format:"a4"});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const pxPerPage=Math.floor(canvas.width*ph/pw);
    for(let y=0,p=0;y<canvas.height;y+=pxPerPage,p++){
      const h=Math.min(pxPerPage,canvas.height-y);const c=document.createElement("canvas");c.width=canvas.width;c.height=h;
      c.getContext("2d").drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(p>0)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,h*pw/canvas.width);
    }
    saveFile(r.file+".pdf",pdf.output("blob"));
  }catch(e){toast("تعذّر إنشاء ملف PDF.");}
  finally{el.remove();}
}

  if(S.view==="login"||!S.user){renderLogin();return;}
  if(S.view==="entry")renderEntry();else renderAdmin();
  window.scrollTo(0,0);
}
window.addEventListener("beforeunload",e=>{if(S.view==="entry"&&dirtyCount()>0){e.preventDefault();e.returnValue="";}});
if(!sb){renderLogin();}
else{loadingScreen("جارٍ التحميل…");sb.auth.getSession().then(({data})=>{if(data&&data.session)afterLogin();else startPublic();}).catch(()=>startPublic());}
})();
